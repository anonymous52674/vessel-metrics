{
 ### Environment Parameters
  debug: false,
  mode: train,
  cuda: true,
  pin_memory: true,
  worker: 8,
  log_interval: 9999,
  save_interval: 1,
  saved_model_directory: '../data/models/HRF',
  train_fold: 1,
  project_name: 'vessel_benchmark',
  CUDA_VISIBLE_DEVICES: '0',

  ### Train Parameters
  model_name: '', # This parameter is automatically set by train_all.py
    n_classes: 1,
    in_channels: 3,
  dataloader: 'Image2Image_zero_pad', 
  criterion: 'DiceBCELoss', 
  task: 'segmentation',
  # RGBfG for VessMAP, DCA1 and OCTA since they are grayscale and need to be converted to RGB
  input_space: 'RGB',
  input_channel: 3,
  # Need to be the next multiple of 32 from the original image resolution [h, w]
  # DRIVE:608, STARE:704, CHASE_DB1:1024, HRF:1344, DCA1: 320, OCTA: 416, VessMAP: 256
  input_size: [1344, 1344],  
  optimizer: 'AdamW',
    lr: 0.001,
    scheduler: 'WarmupCosine',  
    cycles: 100,
    warmup_epoch: 20,
    weight_decay: 0.05, 
  batch_size: 4,
  epoch: 20000,
  ema_decay: 0, 
  class_weight: [1.0, 1.0],
  model_path: '', 
    freeze_layer: false,

  ### Augmentation Parameters
  transform_blur: true,
  transform_jitter: true,
  transform_hflip: true,
  transform_perspective: true,
  transform_cutmix: true,
  transform_rand_resize: true, 
  transform_rand_crop: 288, 

  train_x_path: '../data/HRF/train/input',
  train_y_path: '../data/HRF/train/label',
  val_x_path: '../data/HRF/val/input',
  val_y_path: '../data/HRF/val/label',
}
